[package]
name = "sail-proxy-rs"
version = "0.1.0"
edition = "2024"

[lints.rust]
elided_lifetimes_in_paths = "allow"
rust_2018_idioms = { priority = -1, level = "deny" }

[lints.clippy]
module_inception = "allow"
uninlined_format_args = "allow"

[dependencies]
anyhow = "1.0.104"
parking_lot = "0.13.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uhttp = { version = "0.33.0", features = ["json", "router"] }
uuid = { version = "1.28.0", features = ["v4"] }
self_update = { version = "1.3.1", default-features = false, features = [
  "github",
  "reqwest",
  "rustls",
  "async",
  "archive-tar",
  "compression-tar-gz",
  "checksums",
] }
semver = "1.0.28"